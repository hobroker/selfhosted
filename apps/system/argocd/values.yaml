global:
  domain: argo.hobroker.me

configs:
  params:
    server.insecure: true # terminate TLS at Traefik, serve HTTP internally
  cm:
    # Argo CD has no built-in health check for Application resources (removed in
    # v1.8). Without it the root app-of-apps (bootstrap/system.yaml) can't wait
    # for one sync wave to be healthy before starting the next.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
    resource.customizations.ignoreDifferences.apps_Deployment: |
      jsonPointers:
        - /status
    users.session.duration: "2160h"

server:
  service:
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: 192.168.50.202

  metrics:
    enabled: true

  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hostname: argo.hobroker.me
