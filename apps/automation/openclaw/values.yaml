# OpenClaw values for bjw-s-labs/app-template (vendored from openclaw chart 1.5.36).
# Upstream chart (serhanekicii/openclaw-helm) was archived 2026-05-25.

configMode: merge
skills:
  - weather
  - gog

defaultPodOptions:
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  main:
    replicas: 1
    strategy: Recreate

    initContainers:
      init-config:
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: 2026.5.12
        command:
          - sh
          - /scripts/init-config.sh
        env:
          CONFIG_MODE: '{{ .Values.configMode | default "merge" }}'
        securityContext: &containerSecurityContext
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

      init-skills:
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: 2026.5.12
        command:
          - sh
          - /scripts/init-skills.sh
        env:
          SKILLS_TO_INSTALL: '{{ .Values.skills | join " " }}'
          HOME: /tmp
          NPM_CONFIG_CACHE: /tmp/.npm
        securityContext: *containerSecurityContext

    containers:
      main:
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: 2026.5.12
          pullPolicy: IfNotPresent
        command:
          - node
          - dist/index.js
        args:
          - gateway
          - --bind
          - lan
          - --port
          - "18789"
        envFrom: []
        env: {}
        securityContext: *containerSecurityContext
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        probes:
          liveness:
            enabled: true
            type: TCP
            spec:
              tcpSocket:
                port: 18789
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            type: TCP
            spec:
              tcpSocket:
                port: 18789
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3

      chromium:
        enabled: false
        image:
          repository: chromedp/headless-shell
          tag: 148.0.7778.97
        env:
          # Fontconfig cache needs a writable directory
          XDG_CACHE_HOME: /tmp
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /json/version
                port: 9222
              initialDelaySeconds: 10
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 6
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /json/version
                port: 9222
              initialDelaySeconds: 5
              periodSeconds: 10
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /json/version
                port: 9222
              initialDelaySeconds: 5
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 12

configMaps:
  scripts:
    enabled: true
    data:
      init-config.sh: |
        log() { echo "[$(date -Iseconds)] [init-config] $*"; }

        log "Starting config initialization"
        mkdir -p /home/node/.openclaw
        CONFIG_MODE="${CONFIG_MODE:-merge}"

        if [ "$CONFIG_MODE" = "merge" ] && [ -f /home/node/.openclaw/openclaw.json ]; then
          log "Mode: merge - merging Helm config with existing config"
          if node -e "
            const fs = require('fs');
            // Strip JSON5 single-line comments while preserving // inside strings (e.g. URLs)
            const stripComments = (s) => {
              let r = '', q = false, i = 0;
              while (i < s.length) {
                if (q) {
                  if (s[i] === '\\\\') { r += s[i] + s[i+1]; i += 2; continue; }
                  if (s[i] === '\"') q = false;
                  r += s[i++];
                } else if (s[i] === '\"') {
                  q = true; r += s[i++];
                } else if (s[i] === '/' && s[i+1] === '/') {
                  while (i < s.length && s[i] !== '\n') i++;
                } else { r += s[i++]; }
              }
              return r;
            };
            let existing;
            try {
              existing = JSON.parse(stripComments(fs.readFileSync('/home/node/.openclaw/openclaw.json', 'utf8')));
            } catch (e) {
              console.error('[init-config] Warning: existing config is not valid JSON, will overwrite');
              process.exit(1);
            }
            const helm = JSON.parse(stripComments(fs.readFileSync('/config/openclaw.json', 'utf8')));
            const deepMerge = (target, source) => {
              for (const key of Object.keys(source)) {
                if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
                  target[key] = target[key] || {};
                  deepMerge(target[key], source[key]);
                } else {
                  target[key] = source[key];
                }
              }
              return target;
            };
            const merged = deepMerge(existing, helm);
            fs.writeFileSync('/home/node/.openclaw/openclaw.json', JSON.stringify(merged, null, 2));
          "; then
            log "Config merged successfully"
          else
            log "WARNING: Merge failed (existing config may not be valid JSON), falling back to overwrite"
            cp /config/openclaw.json /home/node/.openclaw/openclaw.json
          fi
        else
          if [ ! -f /home/node/.openclaw/openclaw.json ]; then
            log "Fresh install - writing initial config"
          else
            log "Mode: overwrite - replacing config with Helm values"
          fi
          cp /config/openclaw.json /home/node/.openclaw/openclaw.json
        fi
        log "Config initialization complete"

      init-skills.sh: |
        log() { echo "[$(date -Iseconds)] [init-skills] $*"; }

        log "Starting skills initialization"

        # Installs skills listed in SKILLS_TO_INSTALL (set via the top-level skills: [] value).
        # Set skills: [] in your values to skip skill installation entirely.
        # If a skill needs an extra runtime (uv, pnpm, etc.), install it here before the loop.
        mkdir -p /home/node/.openclaw/workspace/skills
        cd /home/node/.openclaw/workspace
        install_skill() {
          skill="$1"
          SKILL_NAME="$(basename "$skill")"
          if [ -z "$skill" ]; then
            return 0
          fi
          if [ -d "skills/$SKILL_NAME" ]; then
            log "Skill already installed: $skill"
            return 0
          fi
          log "Installing skill: $skill"
          attempts=6
          delay=5
          for i in $(seq 1 "$attempts"); do
            if npx -y clawhub install "$skill" --no-input; then
              log "Installed skill: $skill"
              return 0
            fi
            # Add a little jitter so concurrent pods don't retry in lockstep.
            # POSIX sh has no $RANDOM, so read one byte from /dev/urandom (fall back to 0).
            jitter=$(( $(od -An -N1 -tu1 /dev/urandom 2>/dev/null || echo 0) % 5 ))
            if [ "$i" -lt "$attempts" ]; then
              log "WARNING: Failed to install skill: $skill (attempt $i/$attempts). Retrying in $((delay + jitter))s..."
              sleep $((delay + jitter))
              delay=$((delay * 2))
            fi
          done
          log "WARNING: Failed to install skill after $attempts attempts: $skill"
          return 1
        }
        for skill in $SKILLS_TO_INSTALL; do
          install_skill "$skill" || true
        done
        log "Skills initialization complete"

  config:
    enabled: true
    data:
      openclaw.json: |
        {
          "gateway": {
            "port": 18789,
            "mode": "local",
            "trustedProxies": ["10.0.0.1"]
          },
          "browser": {
            "enabled": true,
            "defaultProfile": "default",
            "profiles": {
              "default": {
                "cdpUrl": "http://localhost:9222",
                "color": "#4285F4"
              }
            }
          },
          "agents": {
            "defaults": {
              "workspace": "/home/node/.openclaw/workspace",
              "model": {
                "primary": "deepseek/deepseek-v4-pro"
              },
              "userTimezone": "UTC",
              "timeoutSeconds": 600,
              "maxConcurrent": 1
            },
            "list": [
              {
                "id": "main",
                "default": true,
                "identity": {
                  "name": "OpenClaw",
                  "emoji": "🦞"
                }
              }
            ]
          },
          "session": {
            "scope": "per-sender",
            "store": "/home/node/.openclaw/sessions",
            "reset": {
              "mode": "idle",
              "idleMinutes": 60
            }
          },
          "logging": {
            "level": "info",
            "consoleLevel": "info",
            "consoleStyle": "compact",
            "redactSensitive": "tools"
          },
          "tools": {
            "profile": "full",
            "web": {
              "search": {
                "enabled": false
              },
              "fetch": {
                "enabled": true
              }
            }
          }
        }

service:
  main:
    controller: main
    ipFamilyPolicy: SingleStack
    ipFamilies:
      - IPv4
    ports:
      http:
        port: 18789

persistence:
  scripts:
    enabled: true
    type: configMap
    identifier: scripts
    advancedMounts:
      main:
        init-config:
          - path: /scripts
            readOnly: true
        init-skills:
          - path: /scripts
            readOnly: true

  config:
    enabled: true
    type: configMap
    identifier: config
    advancedMounts:
      main:
        init-config:
          - path: /config
            readOnly: true

  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: ""
    advancedMounts:
      main:
        init-config:
          - path: /home/node/.openclaw
        init-skills:
          - path: /home/node/.openclaw
        main:
          - path: /home/node/.openclaw

  tmp:
    enabled: true
    type: emptyDir
    advancedMounts:
      main:
        init-config:
          - path: /tmp
        init-skills:
          - path: /tmp
        main:
          - path: /tmp
        chromium:
          - path: /tmp

  npm-cache:
    enabled: true
    type: emptyDir
    advancedMounts:
      main:
        main:
          - path: /home/node/.npm
