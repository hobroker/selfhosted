apiVersion: v1
kind: PersistentVolume
metadata:
  name: floppy-db-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    name: floppy-db-pvc
    namespace: default
  hostPath:
    path: /var/local/floppy
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: floppy-db-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: floppy-db-pv
  resources:
    requests:
      storage: 5Gi
